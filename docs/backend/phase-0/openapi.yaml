openapi: 3.1.0
info:
  title: Helpful Home Direct Invoice API
  version: 0.1.0
  description: Phase 0 API contract for the Direct Invoice backend.
servers:
  - url: https://api.example.com/api/v1
    description: Production (placeholder)
  - url: https://staging-api.example.com/api/v1
    description: Staging (placeholder)
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Current user, role and permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /customers:
    get:
      operationId: listCustomers
      summary: List/search customers
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      summary: Create or upsert customer by phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          $ref: "#/components/responses/Conflict"
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCustomer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /services:
    get:
      operationId: listServices
      parameters:
        - name: published
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
  /invoices:
    get:
      operationId: listInvoices
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      summary: Create a direct invoice and issue it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoice" }
      responses:
        "201":
          description: Invoice issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "422":
          $ref: "#/components/responses/BusinessError"
  /invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getInvoice
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}/amendments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: amendInvoice
      summary: Create a new invoice version
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendInvoice" }
      responses:
        "201":
          description: Amended invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessError"
  /invoices/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listInvoicePayments
      responses:
        "200":
          description: Payment schedule and records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: registerPayment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPayment" }
      responses:
        "201":
          description: Payment registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /payments/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: validatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, cleared]
              properties:
                date: { type: string, format: date }
                cleared: { type: boolean }
                notes: { type: string }
      responses:
        "200":
          description: Payment validated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "422":
          $ref: "#/components/responses/BusinessError"
  /payments/{id}/receipt:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: issueReceipt
      responses:
        "201":
          description: Receipt issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /work-orders:
    get:
      operationId: listWorkOrders
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unassigned, assigned, in_progress, completed] }
        - name: month
          in: query
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: Work orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkOrder" }
  /work-orders/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: assignWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cs_owner_id]
              properties:
                cs_owner_id: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Assigned work order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
  /work-orders/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: completeWorkOrder
      responses:
        "200":
          description: Completed work order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
  /municipal-orders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMunicipalOrder
      responses:
        "200":
          description: Municipal order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MunicipalOrder" }
    patch:
      operationId: updateMunicipalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MunicipalOrder" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MunicipalOrder" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /feature-flags:
    get:
      operationId: listFeatureFlags
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureFlag" }
    patch:
      operationId: updateFeatureFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, enabled]
              properties:
                key: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
  /files/presign:
    post:
      operationId: presignFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type, owner_id, filename, mime]
              properties:
                owner_type: { type: string, enum: [invoice, payment, work_order, municipal_order, customer] }
                owner_id: { type: string }
                filename: { type: string }
                mime: { type: string }
      responses:
        "200":
          description: Upload URL and file id
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id: { type: string }
                  upload_url: { type: string }
                  headers: { type: object, additionalProperties: { type: string } }
  /files/{id}/url:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getFileUrl
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
  responses:
    Conflict:
      description: Conflict or stale version
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BusinessError:
      description: Business rule rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: true }
        request_id: { type: string }
    Me:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        permissions: { type: array, items: { type: string } }
        feature_flags: { type: object, additionalProperties: { type: boolean } }
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        address: { type: string }
        district: { type: string }
        id_number: { type: string }
    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Service:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        price_cents: { type: integer }
        measure: { type: string, enum: [area, length, quantity, fixed] }
        published: { type: boolean }
    Invoice:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string }
        customer: { $ref: "#/components/schemas/Customer" }
        categories: { type: array, items: { type: string } }
        total_cents: { type: integer }
        valid_paid_cents: { type: integer }
        current_version: { type: integer }
        created_at: { type: string, format: date-time }
    CreateInvoice:
      type: object
      required: [date, customer, lines, categories]
      properties:
        date: { type: string, format: date }
        sales_id: { type: string }
        supervisor_id: { type: string }
        categories:
          type: array
          minItems: 1
          items: { type: string, enum: [self-pay, grant-80k, group-buy] }
        grant:
          type: object
          properties:
            application_number: { type: string, nullable: true }
            approved_amount_cents: { type: integer, nullable: true }
        customer: { $ref: "#/components/schemas/CustomerInput" }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, quantity, unit, unit_price_cents]
            properties:
              service_id: { type: string }
              name: { type: string }
              position: { type: string }
              quantity: { type: number }
              unit: { type: string }
              unit_price_cents: { type: integer }
              amount_cents: { type: integer }
    AmendInvoice:
      allOf:
        - $ref: "#/components/schemas/CreateInvoice"
        - type: object
          required: [reason]
          properties:
            reason: { type: string, minLength: 3 }
    Payment:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        installment: { type: integer }
        amount_cents: { type: integer }
        method: { type: string, enum: [cash, fps, transfer, cheque] }
        status: { type: string, enum: [pending, valid, rejected] }
        paid_at: { type: string, format: date }
        proof_file_id: { type: string, nullable: true }
        validated_at: { type: string, format: date-time, nullable: true }
    RegisterPayment:
      type: object
      required: [installment, amount_cents, method, paid_at]
      properties:
        installment: { type: integer }
        amount_cents: { type: integer, minimum: 1 }
        method: { type: string, enum: [cash, fps, transfer, cheque] }
        paid_at: { type: string, format: date }
        reference: { type: string }
        notes: { type: string }
        proof_file_id: { type: string }
        confirm: { type: boolean, default: false }
    Receipt:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        payment_id: { type: string }
        amount_cents: { type: integer }
        issued_at: { type: string, format: date-time }
    WorkOrder:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        invoice_id: { type: string }
        status: { type: string, enum: [unassigned, assigned, in_progress, completed] }
        cs_owner_id: { type: string, nullable: true }
        released_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    MunicipalOrder:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        invoice_id: { type: string }
        work_order_id: { type: string }
        lines: { type: array, items: { type: object, additionalProperties: true } }
    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        active: { type: boolean }
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [invoice_clerk, finance, finance_supervisor, cs, cs_supervisor, admin, admin_staff] }
    FeatureFlag:
      type: object
      properties:
        key: { type: string }
        enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
